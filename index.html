<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SV FWS FFM Protokoll</title>
    <!-- Fonts: Courier Prime for headings, Inter for body -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <!-- PDF via native browser print -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- EDITOR SIDEBAR -->
    <div class="editor-sidebar">
        <div class="sidebar-header">
            <h1>SV PROTOKOLL</h1>
            <div class="version-tag">v3.0</div>
        </div>

        <div class="sidebar-content">
            
            <!-- 1. DATUM & AUTOR -->
            <div class="editor-card">
                <h3 class="card-label">Daten &amp; Autor</h3>
                <div class="field-group">
                    <div>
                        <label class="field-label">Sitzungsdatum (Header)</label>
                        <input type="date" id="in-meeting-date" class="field-input" oninput="updatePreview()">
                    </div>
                    <div>
                        <label class="field-label">Erstellt am (Footer)</label>
                        <input type="date" id="in-print-date" class="field-input" oninput="updatePreview()">
                    </div>
                    <div>
                        <label class="field-label">Autor</label>
                        <input type="text" id="in-author" class="field-input" placeholder="Max Mustermann" oninput="updatePreview()">
                    </div>
                </div>
            </div>

            <!-- 3. ANWESENHEIT -->
            <div class="editor-card">
                <div class="card-header-row">
                    <h3 class="card-label">Anwesenheit</h3>
                    <button onclick="clearAtt()" class="btn-reset">Reset</button>
                </div>
                <div id="att-input-container" class="att-grid">
                    <!-- JS fills this -->
                </div>
            </div>

            <!-- 4. INHALT -->
            <div>
                <div class="card-header-row" style="margin-bottom: 8px;">
                    <h3 class="card-label">Protokollpunkte</h3>
                    <button onclick="addSection()" class="btn-add">+ Punkt</button>
                </div>
                <div id="sections-list" class="sections-list">
                    <!-- JS fills this -->
                </div>
            </div>

        </div>

        <div class="sidebar-footer">
            <button onclick="generatePDF()" id="btn-pdf" class="btn-pdf">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4m4-5 5 5 5-5m-5 5V3"></path></svg>
                PDF Herunterladen
            </button>
        </div>
    </div>

    <!-- PREVIEW AREA -->
    <div class="preview-area">
        <!-- Hidden measurer for calculating content heights -->
        <div id="measurer" aria-hidden="true"></div>
        
        <!-- Pages rendered by JS -->
        <div id="pdf-preview-container">
            <!-- .protocol-page elements inserted here -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
